[package]
name = "hyshot-editor"
version = "0.1.0"
edition = "2024"

[dependencies]
gpui = "0.2.2"
image = { version = "0.25", default-features = false, features = ["png"] }
anyhow = "1.0"
hyshot-core = { path = "../core" }
tiny-skia = "0.12"
fontdue = "0.9"
rust-embed = "8.13"
serde = { version = "1.0", features = ["derive"] }
rfd = "0.15"
notify-rust = "4.18"

[dev-dependencies]
tempfile = "3.27"
