[package]
name = "hyshot"
version = "0.1.9"
edition = "2024"
authors = ["vremyavnikuda <vremyavnikuda@protonmail.com>"]
description = "A utility to easily take screenshots in Wayland using your mouse"
license = "GPL-3.0"
repository = "https://github.com/shikoucore/hyshot"
homepage = "https://github.com/shikoucore/hyshot"
keywords = ["hyprland", "screenshot", "wayland", "cli"]
categories = ["command-line-utilities", "graphics"]
readme = "README.md"
include = ["src/**", "Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "README.md", "LICENSE*"]

[workspace]
members = ["crates/core", "crates/editor"]
resolver = "3"

[dependencies]
hyshot-core = { path = "crates/core" }
hyshot-editor = { path = "crates/editor" }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.0"
notify-rust = "4.11"
anyhow = "1.0"
env_logger = "0.11.8"
libc = "0.2"
dirs = "6.0"
directories = "6.0"
chrono = "0.4"
dialoguer = "0.12"
grim-rs = { version = "0.2", optional = true }
memmap2 = { version = "0.9", optional = true }
tempfile = "3.10"
slurp-rs = "0.2.0"
image = "0.25"
rayon = "1.10.0"

[dependencies.wayland-client]
version = "0.31"
optional = true

[dependencies.wayland-protocols]
version = "0.32"
optional = true
features = ["unstable"]

[dependencies.wayland-protocols-wlr]
version = "0.3"
optional = true
features = ["client"]


[features]
default = ["grim", "freeze"]
grim = ["grim-rs"]
freeze = [
  "grim-rs",
  "wayland-client",
  "wayland-protocols",
  "wayland-protocols-wlr",
  "memmap2",
]
