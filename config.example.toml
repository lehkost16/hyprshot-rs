# ==============================================================================
# Hyshot 推荐配置文件 (config.example.toml)
#
# 文件路径通常为: ~/.config/hyshot/config.toml
# 可通过命令查看当前生效配置: hyshot --show-config
# 也可通过命令行快速设置字段:  hyshot --set <section>.<key> <value>
# ==============================================================================

# ------------------------------------------------------------------------------
# 路径配置 [paths]
# ------------------------------------------------------------------------------
[paths]
# 截图文件默认保存的主目录。
# 支持 ~ (波浪号) 代表用户家目录，以及环境变量展开（如 $HOME/Pictures）。
# 推荐值: "~/Pictures/Screenshots"
screenshots_dir = "~/Pictures/Screenshots"


# ------------------------------------------------------------------------------
# 截图行为配置 [capture]
# ------------------------------------------------------------------------------
[capture]
# 是否在完成截图后发送桌面系统通知。
# 可选值: true, false
# 推荐值: true
notification = true

# 桌面系统通知显示停留时间（单位: 毫秒）。
# 推荐值: 3000
notification_timeout = 3000

# 普通截图（hyshot area / now / win）是否默认保存到磁盘文件。
# - true: 自动存盘并双写写入剪贴板。
# - false: 仅写入剪贴板，不落盘产生文件（临时截图强烈推荐，节省磁盘空间）。
# 推荐值: true (若习惯仅剪贴板使用可设为 false)
save_file = true

# 截图保存的文件格式。
# 可选值: "png", "jpeg", "ppm"
# 推荐值: "png"
file_type = "png"

# JPEG 图片压缩质量（仅当 file_type = "jpeg" 时生效）。
# 取值范围: 1 ~ 100，数值越大画质越高、体积越大。
# 推荐值: 100
jpeg_quality = 100

# PNG 压缩等级（仅当 file_type = "png" 时生效）。
# 取值范围: 0 ~ 9，数值越大压缩率越高，耗时微增。
# 推荐值: 6
png_level = 6

# 自定义图片上传命令（执行 hyshot --upload 时触发）。
# 其中 {path} 会被自动替换为生成的临时或永久截图路径。
# 留空 "" 表示未配置上传。
# 示例: "curl -F 'file=@{path}' https://tmp.link/"
upload_command = ""


# ------------------------------------------------------------------------------
# 高级行为与屏幕冻结 [advanced]
# ------------------------------------------------------------------------------
[advanced]
# 区域选区截图（hyshot area）时是否冻结屏幕。
# - true: 触发瞬间立刻定格画面（动画、视频、弹窗不会移动），方便精准选取。
#         Hyprland 环境下优先采用官方标杆 `hyprpicker -r -z`，其它环境平滑回退到原生 layer-shell。
# - false: 屏幕不停留，保持实时动态选区。
# 推荐值: true
freeze_on_area = true

# 进入标注模式选区（hyshot annotate）时是否冻结屏幕。
# 推荐值: true
freeze_on_annotate = true

# 截图触发前的额外延迟等待时长（单位: 毫秒）。
# 适用于需要截取某些按键后才弹出的右键菜单。
# 推荐值: 0
delay_ms = 0


# ------------------------------------------------------------------------------
# GPUI 标注与 Pin 贴图窗口 [editor]
# ------------------------------------------------------------------------------
[editor]
# 默认文字工具字号（单位: px）。
# 推荐值: 24.0
font_size = 24.0

# 默认画笔/几何图形线条粗细（单位: px）。
# 推荐值: 4.0
line_width = 4.0

# 默认画笔与高亮颜色，格式为 RGBA [R, G, B, A] (0-255)。
# 默认红色: [239, 68, 68, 255]
color = [239, 68, 68, 255]

# 启动标注/贴图窗口时的默认激活工具。
# 可选值: "Rectangle" (矩形), "Pencil" (画笔), "Arrow" (箭头), "Text" (文字),
#         "Mosaic" (马赛克), "SerialNumber" (序号步标)
# 推荐值: "Rectangle"
active_tool = "Rectangle"

# 在标注窗口中按下 Ctrl+C 复制后，是否自动关闭编辑器窗口。
# - true: 复制完立即退出，极速工作流。
# - false: 保持窗口悬浮（作为 Pin 贴图工具继续使用）。
# 推荐值: true
exit_after_copy = true

# 在标注窗口中按下 Ctrl+S 保存后，是否自动关闭编辑器窗口。
# 推荐值: true
exit_after_save = true


# ------------------------------------------------------------------------------
# 长截图（滚动拼接截图）[longshot]
# ------------------------------------------------------------------------------
[longshot]
# 滚屏采样捕获帧率 (FPS)。
# 推荐值: 24 (对于 144Hz/180Hz 等高刷屏体验最佳，保证重叠特征采样充分)
fps = 24

# 列特征差值（SAD）匹配敏感度阈值。
# 越小越严格，推荐范围: 5.0 ~ 15.0。
# 推荐值: 8.0
sad_threshold = 8.0

# 滚动速度极快时允许跳过的最大预测帧数。
# 推荐值: 6
max_skip = 6

# 预测相邻帧之间的期望重叠高度比例（占单帧高度比例）。
# 推荐值: 0.3
target_overlap = 0.3

# 长截图拼接完成保存后的后续行为。
# 可选值:
#   - "save": 仅静默保存到磁盘文件，绝不往剪贴板写入任何数据（强烈推荐！彻底防止大长图占爆剪贴板缓存）。
#   - "copy": 保存并自动将拼接出的整张长图通过 wl-copy 复制到剪贴板。
#   - "open": 保存并调用系统默认看图工具（xdg-open）打开查看。
#   - "edit": 保存并直接唤起 GPUI 标注编辑器进行涂鸦二次加工。
# 推荐值: "save" (或按需设为 "edit")
after_save = "save"


# ------------------------------------------------------------------------------
# 屏幕录制与 GIF 导出 [record]
# (基于 Wayland 高性能录屏引擎 wl-screenrec)
# ------------------------------------------------------------------------------
[record]
# 录制时是否隐藏鼠标指针。
# 推荐值: true
hide_cursor = true

# 录屏的目标帧率 (FPS)。
# 推荐值: 30 (普通录屏/演示 30 最佳，高流畅度可设为 60)
fps = 30

# 画质预设级别。
# 可选值:
#   - "compact": 紧凑体积，适合聊天群/邮件快速分享。
#   - "balanced": 均衡画质与体积（推荐）。
#   - "high": 高保真画质，体积较大。
# 推荐值: "balanced"
quality = "balanced"

# 是否录制系统麦克风/默认音频输入源的声音。
# 推荐值: false (需要解说时可通过 hyshot --set record.audio true 开启)
audio = false

# 录像与 GIF 文件保存的目标目录。
# 推荐值: "~/Videos/Screenrecords"
save_dir = "~/Videos/Screenrecords"

# 输出文件容器格式。
# 可选值: "mp4", "webm", "gif", "mkv"
# 推荐值: "mp4" (通用兼容性最好) 或 "webm"
format = "mp4"

# 录制结束并完成封装后的后续行为。
# 可选值:
#   - "save": 仅静默存盘，绝不污染剪贴板（推荐！）。
#   - "copy": 保存并将录像文件的绝对路径复制到剪贴板。
#   - "open": 保存并自动调用系统默认播放器（xdg-open）打开播放。
# 推荐值: "save"
after_save = "save"


# ------------------------------------------------------------------------------
# 外部扩展工具配置 [external.<name>]
# ------------------------------------------------------------------------------
# 可以在命令行通过 hyshot external <name> 触发外部流程。
# 命令字符串中的 {path} 会被自动替换为生成的临时截图 PNG 文件。

# 示例 1: 本地离线 OCR 文字识别并自动拷入剪贴板
# [external.ocr]
# command = "tesseract {path} stdout -l chi_sim+eng | wl-copy"
# freeze = false

# 示例 2: 划词/区域截图翻译
# [external.translate]
# command = "tesseract {path} stdout -l chi_sim+eng 2>/dev/null | trans -b -s auto -t zh -no-ansi | wl-copy"
# freeze = false
